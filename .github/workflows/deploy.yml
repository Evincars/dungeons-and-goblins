name: Build & Deploy to GitHub Pages

# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) checks, builds and publishes the game
# to https://evincars.github.io/dungeons-and-goblins/, and makes a GitHub release for the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check (types, style rules, gameplay tests)
        run: npm run check

      - name: Build
        env:
          VITE_BASE_URL: /dungeons-and-goblins/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Create the GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes --notes "Play it at https://evincars.github.io/dungeons-and-goblins/"
